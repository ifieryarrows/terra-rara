[package]
name = "copper_rust_accel"
version = "0.2.0"
edition = "2021"
description = "Native Rust (PyO3 + Rayon) kernels for CopperMind financial metrics, quantile calibration, and text processing"

[lib]
name = "copper_rust_accel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "generate-import-lib"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
