[package]
name = "copper_rust_accel"
version = "0.1.0"
edition = "2021"
description = "Optional Rust (PyO3) native kernels for CopperMind financial metrics and text normalization"

[lib]
name = "copper_rust_accel"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py310", "generate-import-lib"] }
