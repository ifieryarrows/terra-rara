name: Daily Pipeline Trigger

on:
    schedule:
        # Tue-Sat 00:10 UTC (right after Mon-Fri US settlement + OpenRouter quota reset)
        # Monday 05:00 UTC weekly XGBoost retrain (after Sunday 21:00 UTC TFT retrain)
        - cron: "10 0 * * 2-6"
        - cron: "0 5 * * 1"

    workflow_dispatch:
        inputs:
            train_model:
                description: "Retrain XGBoost model (TFT retrain is handled by the weekly tft-training workflow)"
                required: false
                default: "false"
                type: choice
                options:
                    - "false"
                    - "true"

concurrency:
    group: daily-pipeline
    cancel-in-progress: false

jobs:
    trigger-pipeline:
        runs-on: ubuntu-latest

        steps:
            - name: Trigger Pipeline
              run: |
                  if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
                    TRAIN_MODEL="${{ github.event.inputs.train_model || 'false' }}"
                  elif [ "${{ github.event.schedule }}" == "0 5 * * 1" ]; then
                    TRAIN_MODEL="true"
                    echo "Weekly Monday cron triggered — enabling XGBoost retraining"
                  else
                    TRAIN_MODEL="false"
                  fi

                  echo "Triggering pipeline with train_model=$TRAIN_MODEL"

                  RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
                    "${{ secrets.API_BASE_URL }}/api/pipeline/trigger?train_model=$TRAIN_MODEL&trigger_source=github-actions" \
                    -H "Authorization: Bearer ${{ secrets.PIPELINE_TRIGGER_SECRET }}" \
                    -H "Content-Type: application/json")

                  HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                  BODY=$(echo "$RESPONSE" | sed '$d')

                  echo "Response code: $HTTP_CODE"
                  echo "Response body: $BODY"

                  if [ "$HTTP_CODE" -ne 200 ]; then
                    echo "Pipeline trigger failed with HTTP $HTTP_CODE"
                    exit 1
                  fi

                  RUN_ID=$(echo "$BODY" | jq -er '.run_id')
                  echo "Pipeline job enqueued: $RUN_ID"

                  for ATTEMPT in $(seq 1 120); do
                    STATUS_RESPONSE=$(curl -s -w "\n%{http_code}" \
                      "${{ secrets.API_BASE_URL }}/api/pipeline/runs/$RUN_ID" \
                      -H "Authorization: Bearer ${{ secrets.PIPELINE_TRIGGER_SECRET }}")
                    STATUS_CODE=$(echo "$STATUS_RESPONSE" | tail -n1)
                    STATUS_BODY=$(echo "$STATUS_RESPONSE" | sed '$d')

                    if [ "$STATUS_CODE" -eq 404 ]; then
                      sleep 30
                      continue
                    fi
                    if [ "$STATUS_CODE" -ne 200 ]; then
                      echo "Status polling failed with HTTP $STATUS_CODE"
                      exit 1
                    fi

                    RUN_STATUS=$(echo "$STATUS_BODY" | jq -r '.status')
                    QUALITY_STATE=$(echo "$STATUS_BODY" | jq -r '.quality_state')
                    echo "Poll $ATTEMPT: status=$RUN_STATUS quality=$QUALITY_STATE"

                    if [ "$RUN_STATUS" != "queued" ] && [ "$RUN_STATUS" != "running" ]; then
                      {
                        echo "### Daily pipeline run $RUN_ID"
                        echo '```json'
                        echo "$STATUS_BODY" | jq '{status, quality_state, error_message, fallback_counts, commentary_generation_mode, stage_errors: ((.stage_results // {}) | with_entries(select(.key | endswith("_error"))))}'
                        echo '```'
                      } >> "$GITHUB_STEP_SUMMARY"
                    fi

                    case "$RUN_STATUS" in
                      success)
                        echo "$STATUS_BODY" | jq .
                        exit 0
                        ;;
                      degraded)
                        echo "::warning::Daily pipeline completed in degraded fallback mode (quality=$QUALITY_STATE)"
                        echo "$STATUS_BODY" | jq .
                        exit 0
                        ;;
                      failed|skipped_locked)
                        echo "$STATUS_BODY" | jq .
                        exit 1
                        ;;
                      queued|running)
                        sleep 30
                        ;;
                      *)
                        echo "Unexpected terminal status: $RUN_STATUS"
                        echo "$STATUS_BODY" | jq .
                        exit 1
                        ;;
                    esac
                  done

                  echo "Pipeline did not reach a terminal state within 60 minutes"
                  exit 1
