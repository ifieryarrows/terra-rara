name: Screener Pipeline

on:
  schedule:
    # Weekly: Sunday 18:00 UTC (before Sunday 21:00 UTC tft-training workflow)
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      run_universe:
        description: "Run Universe Builder"
        required: false
        default: true
        type: boolean
      run_screener:
        description: "Run Feature Screener"
        required: false
        default: true
        type: boolean

env:
  PYTHONPATH: backend

concurrency:
  group: screener-pipeline
  cancel-in-progress: false

jobs:
  screener-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache price data
        uses: actions/cache@v4
        with:
          path: backend/artifacts/raw/prices
          key: prices-${{ hashFiles('backend/config/screener_config.yaml') }}-week-${{ github.run_id }}
          restore-keys: |
            prices-${{ hashFiles('backend/config/screener_config.yaml') }}-week-

      - name: Create artifacts directory
        run: mkdir -p backend/artifacts/universes backend/artifacts/runs backend/artifacts/raw/prices

      - name: Run Universe Builder
        if: ${{ github.event.inputs.run_universe != 'false' }}
        working-directory: backend
        run: |
          python -m screener universe_builder \
            --config config/screener_config.yaml \
            --output artifacts/universes
        continue-on-error: false

      - name: Run Feature Screener
        if: ${{ github.event.inputs.run_screener != 'false' }}
        working-directory: backend
        run: |
          python -m screener feature_screener \
            --universe artifacts/universes/latest/universe.json \
            --config config/screener_config.yaml \
            --output artifacts/runs
        continue-on-error: false

      - name: List generated artifacts
        run: |
          echo "=== Universe Artifacts ==="
          ls -la backend/artifacts/universes/ || true
          echo "=== Run Artifacts ==="
          ls -la backend/artifacts/runs/ || true

      - name: Upload screener artifacts
        uses: actions/upload-artifact@v4
        with:
          name: screener-results-${{ github.run_id }}
          path: |
            backend/artifacts/universes/
            backend/artifacts/runs/
          retention-days: 90
          if-no-files-found: warn

      - name: Update challenger.json from screener output
        id: update_challenger
        if: ${{ github.event.inputs.run_screener != 'false' }}
        working-directory: backend
        run: |
          SELECTED=$(find artifacts/runs -name "selected_symbols.json" -path "*/latest/*" 2>/dev/null | head -1)
          if [ -z "$SELECTED" ]; then
            SELECTED=$(find artifacts/runs -name "selected_symbols.json" | sort | tail -1)
          fi
          if [ -z "$SELECTED" ] || [ ! -f "$SELECTED" ]; then
            echo "No selected_symbols.json found, skipping challenger update"
            echo "symbols_changed=false" >> "$GITHUB_OUTPUT"
            echo "differs_from_active=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<PY
          import json, os, shutil
          from pathlib import Path

          def extract_symbols(path: Path) -> list[str]:
              if not path.exists():
                  return []
              data = json.loads(path.read_text(encoding="utf-8"))
              if "selected" in data:
                  return sorted(str(s["ticker"]) for s in data["selected"] if s.get("ticker"))
              return sorted(str(s) for s in data.get("symbols", []))

          selected_path = Path("$SELECTED")
          challenger_path = Path("config/symbol_sets/challenger.json")
          active_path = Path("config/symbol_sets/active.json")

          new_syms = extract_symbols(selected_path)
          old_syms = extract_symbols(challenger_path)
          active_syms = extract_symbols(active_path)

          changed = bool(new_syms) and (new_syms != old_syms)
          differs = bool(new_syms) and (new_syms != active_syms)
          if changed:
              shutil.copy2(selected_path, challenger_path)
              print(f"Updated challenger.json ({len(new_syms)} symbols): {new_syms}")
          else:
              print(f"Canonical symbol set unchanged ({len(old_syms)} symbols); ignoring metadata churn")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"symbols_changed={'true' if changed else 'false'}\n")
              fh.write(f"differs_from_active={'true' if differs else 'false'}\n")
          PY

      - name: Commit updated challenger.json
        id: commit_challenger
        if: ${{ github.event.inputs.run_screener != 'false' && steps.update_challenger.outputs.symbols_changed == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/config/symbol_sets/challenger.json
          if git diff --cached --quiet; then
            echo "No changes to challenger.json"
            echo "challenger_updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(screener): update challenger.json from screener run $(date +%Y%m%d)"
            git pull --rebase origin main
            git push
            echo "challenger_updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Champion/Challenger Backtest
        if: ${{ steps.commit_challenger.outputs.challenger_updated == 'true' && steps.update_challenger.outputs.differs_from_active == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          OOS_START=$(date -u -d "$TODAY - 365 days" +%Y-%m-%d)
          echo "Challenger set updated & differs from active — triggering backtest ($OOS_START -> $TODAY)"
          gh workflow run backtest.yml \
            --ref main \
            --field champion_path="backend/config/symbol_sets/active.json" \
            --field challenger_path="backend/config/symbol_sets/challenger.json" \
            --field oos_start="$OOS_START" \
            --field oos_end="$TODAY" \
            --field include_tft="true"
          echo "Backtest workflow dispatched successfully"
