name: TFT Deterministic Weekly Validation

on:
  workflow_dispatch:
    inputs:
      data_as_of:
        description: "UTC ISO-8601 feature-store cutoff for replayable validation"
        required: true
        type: string
      feature_snapshot_run_id:
        description: "Optional prior validation run whose immutable feature snapshot should be replayed"
        required: false
        default: ""
        type: string
      expected_data_snapshot_sha:
        description: "Optional SHA-256 of the immutable TFT feature snapshot"
        required: false
        default: ""
        type: string

env:
  PYTHONPATH: backend
  MODEL_DIR: /tmp/models
  PYTHONHASHSEED: "42"
  CUBLAS_WORKSPACE_CONFIG: ":4096:8"
  OMP_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  TFT_DATA_AS_OF: ${{ github.event.inputs.data_as_of || '' }}
  TFT_FEATURE_SNAPSHOT_PATH: /tmp/models/tft/feature_snapshot.pkl
  TFT_EXPECTED_DATA_SNAPSHOT_SHA: ${{ github.event.inputs.expected_data_snapshot_sha || '' }}

jobs:
  deterministic-weekly-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: "pip"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints-tft.txt

      - name: Create model directory
        run: |
          mkdir -p /tmp/models/tft/checkpoints

      - name: Download immutable feature snapshot
        if: ${{ github.event.inputs.feature_snapshot_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: tft-deterministic-validation-${{ github.event.inputs.feature_snapshot_run_id }}
          path: /tmp/tft-feature-snapshot/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.inputs.feature_snapshot_run_id }}

      - name: Verify immutable feature snapshot
        if: ${{ github.event.inputs.feature_snapshot_run_id != '' }}
        run: |
          test -f /tmp/tft-feature-snapshot/feature_snapshot.pkl
          test -f /tmp/tft-feature-snapshot/feature_snapshot.pkl.json
          cp /tmp/tft-feature-snapshot/feature_snapshot.pkl /tmp/models/tft/feature_snapshot.pkl
          cp /tmp/tft-feature-snapshot/feature_snapshot.pkl.json /tmp/models/tft/feature_snapshot.pkl.json

      - name: Record validation environment
        working-directory: backend
        run: python -m pip freeze | sort > /tmp/models/tft/environment.txt

      - name: Run deterministic weekly validation
        working-directory: backend
        run: |
          python -m deep_learning.training.trainer --deterministic-weekly-validation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOKENIZERS_PARALLELISM: "false"

      - name: Quality gate — deterministic validation
        working-directory: backend
        run: python scripts/tft_quality_gate.py

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tft-deterministic-validation-${{ github.run_id }}
          path: /tmp/models/tft/
          retention-days: 14

      - name: Show artifact directory
        if: always()
        run: |
          echo "=== /tmp/models/tft ==="
          ls -la /tmp/models/tft/ || true
          echo ""
          echo "=== /tmp/models/tft/checkpoints ==="
          ls -la /tmp/models/tft/checkpoints/ || true

      - name: Show metadata if present
        if: always()
        run: |
          echo "=== tft_metadata.json ==="
          cat /tmp/models/tft/tft_metadata.json || true
          echo ""
          echo "=== artifact_manifest.json ==="
          cat /tmp/models/tft/artifact_manifest.json || true
