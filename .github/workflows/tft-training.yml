name: TFT-ASRO Training Pipeline

on:
    schedule:
        # Weekly retrain: every Sunday at 22:00 UTC (01:00 Istanbul Monday)
        - cron: "0 22 * * 0"

    workflow_dispatch:
        inputs:
            use_asro:
                description: "Use ASRO loss (vs standard QuantileLoss)"
                required: false
                default: "true"
                type: choice
                options:
                    - "true"
                    - "false"
            run_hyperopt:
                description: "Run Optuna hyperparameter optimization"
                required: false
                default: "true"
                type: choice
                options:
                    - "true"
                    - "false"
            hyperopt_trials:
                description: "Number of Optuna trials. Weekly recovery requires at least 30 trials and 10 finite completions."
                required: false
                default: "30"
                type: string
            data_as_of:
                description: "Optional UTC ISO-8601 feature-store cutoff for replayable validation"
                required: false
                default: ""
                type: string
            feature_snapshot_run_id:
                description: "Optional prior validation run whose immutable feature snapshot should be replayed"
                required: false
                default: ""
                type: string
            expected_data_snapshot_sha:
                description: "Optional SHA-256 of the immutable TFT feature snapshot"
                required: false
                default: ""
                type: string
            optuna_results_run_id:
                description: "Optional prior TFT run whose validation-selected Optuna artifact should be replayed when hyperopt is skipped"
                required: false
                default: ""
                type: string

env:
    PYTHONPATH: backend
    MODEL_DIR: /tmp/models
    PYTHONHASHSEED: "42"
    CUBLAS_WORKSPACE_CONFIG: ":4096:8"
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
    TFT_DATA_AS_OF: ${{ github.event.inputs.data_as_of || '' }}
    TFT_FEATURE_SNAPSHOT_PATH: /tmp/models/tft/feature_snapshot.pkl
    TFT_EXPECTED_DATA_SNAPSHOT_SHA: ${{ github.event.inputs.expected_data_snapshot_sha || '' }}

jobs:
    # ─────────────────────────────────────────────────────────────────────────
    # JOB 1 — Hyperparameter search (~108 min, own 3 h budget)
    # Skipped when run_hyperopt is explicitly set to "false".
    # ─────────────────────────────────────────────────────────────────────────
    hyperopt:
        runs-on: ubuntu-latest
        timeout-minutes: 355
        if: ${{ github.event.inputs.run_hyperopt != 'false' }}

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11.15"
                  cache: "pip"

            - name: Install dependencies
              working-directory: backend
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -c constraints-tft.txt

            - name: Create model directory
              run: mkdir -p /tmp/models/tft/checkpoints

            - name: Download immutable feature snapshot
              if: ${{ github.event.inputs.feature_snapshot_run_id != '' }}
              uses: actions/download-artifact@v4
              with:
                  name: tft-deterministic-validation-${{ github.event.inputs.feature_snapshot_run_id }}
                  path: /tmp/tft-feature-snapshot/
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  run-id: ${{ github.event.inputs.feature_snapshot_run_id }}

            - name: Verify immutable feature snapshot
              if: ${{ github.event.inputs.feature_snapshot_run_id != '' }}
              run: |
                  test -f /tmp/tft-feature-snapshot/feature_snapshot.pkl
                  test -f /tmp/tft-feature-snapshot/feature_snapshot.pkl.json
                  cp /tmp/tft-feature-snapshot/feature_snapshot.pkl /tmp/models/tft/feature_snapshot.pkl
                  cp /tmp/tft-feature-snapshot/feature_snapshot.pkl.json /tmp/models/tft/feature_snapshot.pkl.json

            - name: Record hyperopt environment
              working-directory: backend
              run: python -m pip freeze | sort > /tmp/models/tft/hyperopt_environment.txt

            - name: Backfill FinBERT embeddings
              # A supplied immutable feature snapshot already contains the
              # exact embedding frame for replay. Backfilling the live DB in
              # that mode is unnecessary and can mutate the source between
              # hyperopt and training.
              if: ${{ github.event.inputs.feature_snapshot_run_id == '' }}
              working-directory: backend
              run: |
                  python -m deep_learning.data.embeddings --backfill --days 180 --pca-dim 8
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
              continue-on-error: true

            - name: Run Optuna hyperparameter search
              working-directory: backend
              run: |
                  N_TRIALS="${{ github.event.inputs.hyperopt_trials || '30' }}"
                  python -m deep_learning.training.hyperopt \
                    --n-trials "$N_TRIALS" \
                    --study-name tft_asro_optuna
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Upload Optuna results artifact
              uses: actions/upload-artifact@v4
              with:
                  # trainer.py reads optuna_results.json from tft/ root via
                  # _apply_optuna_results(). The train job restores it there.
                  name: optuna-results-${{ github.run_id }}
                  path: |
                      /tmp/models/tft/optuna_results.json
                      /tmp/models/tft/hyperopt_environment.txt
                  retention-days: 7

    # ─────────────────────────────────────────────────────────────────────────
    # JOB 2 — Final training (~50 min, own 3 h budget)
    # Runs after hyperopt (if it ran) OR directly when hyperopt is skipped.
    # ─────────────────────────────────────────────────────────────────────────
    train:
        runs-on: ubuntu-latest
        timeout-minutes: 175  # ~50 min expected + 125 min buffer for large datasets
        needs: [hyperopt]
        # Run when:
        #   a) hyperopt succeeded, OR
        #   b) hyperopt was skipped (run_hyperopt == 'false')
        if: |
            always() &&
            (needs.hyperopt.result == 'success' || needs.hyperopt.result == 'skipped')

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11.15"
                  cache: "pip"

            - name: Install dependencies
              working-directory: backend
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt -c constraints-tft.txt

            - name: Create model directory
              run: mkdir -p /tmp/models/tft/checkpoints

            - name: Download immutable feature snapshot
              if: ${{ github.event.inputs.feature_snapshot_run_id != '' }}
              uses: actions/download-artifact@v4
              with:
                  name: tft-deterministic-validation-${{ github.event.inputs.feature_snapshot_run_id }}
                  path: /tmp/tft-feature-snapshot/
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  run-id: ${{ github.event.inputs.feature_snapshot_run_id }}

            - name: Verify immutable feature snapshot
              if: ${{ github.event.inputs.feature_snapshot_run_id != '' }}
              run: |
                  test -f /tmp/tft-feature-snapshot/feature_snapshot.pkl
                  test -f /tmp/tft-feature-snapshot/feature_snapshot.pkl.json
                  cp /tmp/tft-feature-snapshot/feature_snapshot.pkl /tmp/models/tft/feature_snapshot.pkl
                  cp /tmp/tft-feature-snapshot/feature_snapshot.pkl.json /tmp/models/tft/feature_snapshot.pkl.json

            - name: Record training environment
              working-directory: backend
              run: python -m pip freeze | sort > /tmp/models/tft/environment.txt

            - name: Download Optuna results artifact
              # Only attempt download when hyperopt actually ran and succeeded.
              if: ${{ needs.hyperopt.result == 'success' }}
              uses: actions/download-artifact@v4
              with:
                  name: optuna-results-${{ github.run_id }}
                  # Restores optuna_results.json to tft/ root so that
                  # _apply_optuna_results() in trainer.py picks it up.
                  path: /tmp/models/tft/

            - name: Download replayed Optuna results artifact
              # A normal train replay may reuse a validation-selected artifact
              # without rerunning the expensive search. This remains opt-in
              # and auditable through the explicit source run id.
              if: ${{ needs.hyperopt.result == 'skipped' && github.event.inputs.run_hyperopt == 'false' && github.event.inputs.optuna_results_run_id != '' }}
              uses: actions/download-artifact@v4
              with:
                  name: optuna-results-${{ github.event.inputs.optuna_results_run_id }}
                  path: /tmp/models/tft/
                  github-token: ${{ secrets.GITHUB_TOKEN }}
                  repository: ${{ github.repository }}
                  run-id: ${{ github.event.inputs.optuna_results_run_id }}

            - name: Train TFT-ASRO model
              working-directory: backend
              run: |
                  ASRO_FLAG=""
                  if [ "${{ github.event.inputs.use_asro || 'true' }}" == "false" ]; then
                    ASRO_FLAG="--no-asro"
                  fi
                  python -m deep_learning.training.trainer --symbol HG=F $ASRO_FLAG
              env:
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}

            - name: Upload model artifacts (GitHub)
              uses: actions/upload-artifact@v4
              with:
                  name: tft-model-${{ github.run_id }}
                  path: /tmp/models/tft/
                  retention-days: 90

            - name: Quality gate — metric validation
              id: quality_gate
              working-directory: backend
              run: python scripts/tft_quality_gate.py
              continue-on-error: true

            - name: Rollback on quality gate failure
              if: ${{ steps.quality_gate.outcome == 'failure' }}
              run: |
                  echo "⚠️  Quality gate FAILED — rolling back to previous checkpoint"
                  echo "The HF Hub checkpoint was NOT updated (upload now happens after gate)."
                  echo "Manual intervention required: check training logs and metrics."
                  echo ""
                  echo "To recover, re-run with previous hyperopt results or use:"
                  echo "  gh workflow run tft-training.yml -f run_hyperopt=false"
                  exit 1

            - name: Upload model artifacts to HF Hub
              if: ${{ steps.quality_gate.outcome == 'success' }}
              working-directory: backend
              run: |
                  python - <<'PY'
                  import json
                  from pathlib import Path
                  from deep_learning.config import get_tft_config
                  from deep_learning.models.hub import upload_tft_artifacts
                  from deep_learning.training.trainer import persist_promoted_tft_metadata

                  cfg = get_tft_config()
                  tft_dir = Path(cfg.training.best_model_path).parent
                  ok = upload_tft_artifacts(
                      local_dir=tft_dir,
                      repo_id=cfg.training.hf_model_repo,
                      commit_message="TFT-ASRO checkpoint (quality gate passed)",
                  )
                  if not ok:
                      raise SystemExit(1)

                  metadata = json.loads(
                      (tft_dir / "tft_metadata.json").read_text(encoding="utf-8")
                  )
                  persist_promoted_tft_metadata(
                      cfg.feature_store.target_symbol,
                      metadata,
                  )
                  PY
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
                  DATABASE_URL: ${{ secrets.DATABASE_URL }}

            - name: Display training results
              if: ${{ always() }}
              run: |
                  echo "=== TFT-ASRO Training Complete ==="
                  if [ -f "/tmp/models/tft/optuna_results.json" ]; then
                    echo "--- Optuna Results Applied ---"
                    python -m json.tool /tmp/models/tft/optuna_results.json
                  fi
                  ls -la /tmp/models/tft/ 2>/dev/null || echo "No model directory"
                  ls -la /tmp/models/tft/checkpoints/ 2>/dev/null || echo "No checkpoints"
                  echo ""
                  if [ "${{ steps.quality_gate.outcome }}" == "failure" ]; then
                    echo "⚠️  QUALITY GATE FAILED — see above for details"
                  else
                    echo "✅ Model checkpoint has been automatically uploaded to HF Hub."
                    echo "The HF Space will download it on next inference request."
                  fi

    # ─────────────────────────────────────────────────────────────────────────
    # JOB 3 — Walk-forward backtest (chained)
    # Runs only when training succeeded so ValidationPage gets a fresh
    # BacktestReport without manual intervention. Failure here does NOT
    # break the overall pipeline — model is already trained and uploaded.
    # ─────────────────────────────────────────────────────────────────────────
    backtest:
        needs: [train]
        if: ${{ needs.train.result == 'success' }}
        uses: ./.github/workflows/backtest.yml
        secrets: inherit
        with:
            include_tft: "true"
