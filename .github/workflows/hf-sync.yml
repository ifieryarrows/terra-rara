name: Sync to Hugging Face Space

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check token exists
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "HF_TOKEN secret is not set"
            exit 1
          fi
          echo "HF_TOKEN secret is configured"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Configure production runtime variables
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen
          from huggingface_hub import HfApi

          api = HfApi(token=os.environ["HF_TOKEN"])
          variables = {
              "OPENROUTER_MODEL": "nvidia/nemotron-3-super-120b-a12b:free",
              "LLM_SENTIMENT_MODEL": "nvidia/nemotron-3-super-120b-a12b:free",
              "OPENROUTER_MODEL_SCORING": "nvidia/nemotron-3-super-120b-a12b:free",
              "OPENROUTER_MODEL_SCORING_FAST": "nvidia/nemotron-3-super-120b-a12b:free",
              "OPENROUTER_MODEL_SCORING_RELIABLE": "liquid/lfm-2.5-2.6b:free",
              "OPENROUTER_MODEL_COMMENTARY": "nvidia/nemotron-3-super-120b-a12b:free",
              "OPENROUTER_RPM": "12",
              "OPENROUTER_MAX_RETRIES": "1",
              "OPENROUTER_TIMEOUT_SECONDS": "45",
              "OPENROUTER_CHAIN_DEADLINE_SECONDS": "120",
              "MAX_LLM_ARTICLES_PER_RUN": "100",
              "OPENROUTER_FALLBACK_MODELS": "liquid/lfm-2.5-2.6b:free,nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free",
              "XGB_ARTIFACT_SOURCE": "auto",
          }
          role_models = {
              variables["OPENROUTER_MODEL"],
              variables["LLM_SENTIMENT_MODEL"],
              variables["OPENROUTER_MODEL_SCORING"],
              variables["OPENROUTER_MODEL_SCORING_FAST"],
              variables["OPENROUTER_MODEL_SCORING_RELIABLE"],
              variables["OPENROUTER_MODEL_COMMENTARY"],
              *[item.strip() for item in variables["OPENROUTER_FALLBACK_MODELS"].split(",") if item.strip()],
          }
          catalog_request = Request(
              "https://openrouter.ai/api/v1/models",
              headers={"User-Agent": "terra-rara-hf-sync"},
          )
          with urlopen(catalog_request, timeout=30) as response:
              catalog = {
                  item["id"]: item
                  for item in json.load(response).get("data", [])
                  if item.get("id")
              }
          missing_models = sorted(role_models - set(catalog))
          if missing_models:
              raise RuntimeError(
                  "OpenRouter model catalog no longer contains configured slugs: "
                  + ", ".join(missing_models)
              )
          unsupported_structured = [
              model
              for model in role_models
              if "response_format" not in (catalog[model].get("supported_parameters") or [])
          ]
          if unsupported_structured:
              raise RuntimeError(
                  "Configured structured-output roles do not support response_format: "
                  + ", ".join(sorted(set(unsupported_structured)))
              )
          print(f"Validated {len(role_models)} OpenRouter model slugs against the live catalog")
          current_variables = api.get_space_variables("ifieryarrows/copper-mind")
          for key, value in variables.items():
              # Existing production configuration stored some runtime model
              # keys as Space secrets. HF rejects a secret+variable collision,
              # so standardize these environment entries as secrets without
              # printing their values.
              if key in current_variables:
                  api.delete_space_variable(
                      repo_id="ifieryarrows/copper-mind",
                      key=key,
                  )
              api.add_space_secret(
                  repo_id="ifieryarrows/copper-mind",
                  key=key,
                  value=value,
              )
          print("Configured production runtime roles and bounded retry policy")
          PY

      - name: Prepare files for upload
        run: |
          mkdir -p backend/data/models
          if [ -d "data/models" ]; then
            cp -r data/models/* backend/data/models/ 2>/dev/null || true
            echo "Model files copied"
            ls -la backend/data/models/
          else
            echo "No model files found in data/models/"
          fi
          mkdir -p backend/data/models/tft

      - name: Upload backend to Space
        run: |
          cd backend
          python -c "
          from huggingface_hub import HfApi
          import os

          api = HfApi(token=os.environ['HF_TOKEN'])
          api.upload_folder(
              folder_path='.',
              repo_id='ifieryarrows/copper-mind',
              repo_type='space',
              commit_message='Sync from GitHub (tests passed)',
              ignore_patterns=[
                  'tests/*',
                  '__pycache__/*',
                  '*.pyc',
                  '.pytest_cache/*',
                  'artifacts/*',
                  '*.egg-info/*',
              ],
          )
          print('Upload complete')
          "
